# GitLab CI/CD configuration for acia
# Python 3.10+ project with Ruff linting, mypy type checking, and pytest testing

image: python:3.10

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Global pip cache - persisted between pipeline runs
cache:
  key: pip-${CI_JOB_IMAGE}
  paths:
    - .cache/pip/

stages:
  - lint
  - build
  - test
  - deploy

# Lint and format check with Ruff
lint:
  stage: lint
  script:
    - pip install ruff
    - ruff check acia tests
    - ruff format --check acia tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Type checking with mypy
typecheck:
  stage: lint
  script:
    - pip install mypy
    - mypy acia --ignore-missing-imports
  allow_failure: true  # Start permissive, remove once types are added
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Build wheel for each Python version
build:
  image: python:$PY_VERSION
  parallel:
    matrix:
      - PY_VERSION: ['3.10', '3.11', '3.12', '3.13']
  stage: build
  tags:
    - biggpu
  script:
    - pip install build twine
    - python -m build
    - pip install dist/*.whl
    - twine check dist/*
  artifacts:
    paths:
      - dist/*.whl

# Test on each Python version
test:
  image: python:$PY_VERSION
  parallel:
    matrix:
      - PY_VERSION: ['3.10', '3.11', '3.12', '3.13']
  stage: test
  tags:
    - biggpu
  needs:
    - job: build
      parallel:
        matrix:
          - PY_VERSION: $PY_VERSION
  cache:
    - key: pip-${CI_JOB_IMAGE}
      paths:
        - .cache/pip/
    - key: test-resources-v1
      paths:
        - test_resources/
  script:
    # test dependencies
    - pip install pytest pytest-sugar pytest-cov python-dotenv coverage unittest-xml-reporting
    - pip install git+https://github.com/JojoDevel/trackastra.git
    - pip install laptrack
    # install the pre-built wheel from build job
    - pip install dist/*.whl
    # download data for testing (only if not cached)
    - |
      if [ ! -d "test_resources/ctc_format" ]; then
        mkdir -p test_resources
        wget -O test_resources/ctc_format.zip https://fz-juelich.sciebo.de/s/8dEFaTKl26H26wO/download
        unzip test_resources/ctc_format.zip -d test_resources/ctc_format
      fi
    # perform the tests
    - coverage run -m pytest --junitxml=report.xml --cov-report term --cov-report xml --cov=acia tests/
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: report.xml

# Deploy documentation to GitLab Pages
pages:
  stage: deploy
  script:
    - pip install sphinx sphinx-rtd-theme pint
    - cd docs && make html
    - mv _build/html/ ../public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
