# GitLab CI/CD configuration for acia
# Python 3.10+ project with Ruff linting, mypy type checking, and pytest testing

image: python:3.10

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Global pip cache - persisted between pipeline runs
cache:
  key: pip-${CI_JOB_IMAGE}
  paths:
    - .cache/pip/

stages:
  - lint
  - build
  - test
  - deploy

# Lint and format check with Ruff
lint:
  stage: lint
  script:
    # PINNED, and it must stay pinned: an unpinned ruff silently upgrades under
    # you and changes what "formatted" means. ruff 0.16 began formatting Python
    # code blocks inside Markdown, which reformats the illustrative snippets in
    # docs/*.md and fails this job on a green working tree. Keep in lockstep with
    # .github/workflows/ci.yml and .pre-commit-config.yaml.
    - pip install ruff==0.15.15
    # docs/ is included because ruff lints .ipynb by default -- the tutorial
    # notebooks are real source and regress like any other code.
    - ruff check acia tests docs
    - ruff format --check acia tests docs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Type checking with mypy
typecheck:
  stage: lint
  script:
    # PINNED to match .github/workflows/ci.yml and .pre-commit-config.yaml.
    # Unpinned, this job installs whatever mypy is current -- mypy 2.x reports 5
    # errors in acia/notebook.py that 1.19.1 does not, so the job goes orange for
    # reasons unrelated to the commit that triggered it.
    - pip install mypy==1.19.1
    - mypy acia --ignore-missing-imports
  allow_failure: true  # Start permissive, remove once types are added
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Build wheel for each Python version
build:
  image: python:$PY_VERSION
  parallel:
    matrix:
      - PY_VERSION: ['3.10', '3.11', '3.12', '3.13']
  stage: build
  tags:
    - biggpu
  script:
    - pip install build twine
    - python -m build
    - pip install dist/*.whl
    - twine check dist/*
  artifacts:
    paths:
      - dist/*.whl

# Test on each Python version
test:
  image: python:$PY_VERSION
  parallel:
    matrix:
      - PY_VERSION: ['3.10', '3.11', '3.12', '3.13']
  stage: test
  tags:
    - biggpu
  needs:
    - job: build
      parallel:
        matrix:
          - PY_VERSION: ['3.10', '3.11', '3.12', '3.13']
  cache:
    - key: pip-${CI_JOB_IMAGE}
      paths:
        - .cache/pip/
    - key: test-resources-v1
      paths:
        - test_resources/
  script:
    # test dependencies
    - pip install pytest pytest-sugar pytest-cov python-dotenv unittest-xml-reporting
    - pip install git+https://github.com/JojoDevel/trackastra.git
    - pip install laptrack
    # install the pre-built wheel from build job
    - pip install dist/*.whl
    # download data for testing (only if not cached)
    - |
      if [ ! -d "test_resources/ctc_format" ]; then
        mkdir -p test_resources
        wget -O test_resources/ctc_format.zip https://fz-juelich.sciebo.de/s/8dEFaTKl26H26wO/download
        unzip test_resources/ctc_format.zip -d test_resources/ctc_format
      fi
    # perform the tests
    - pytest --cov=acia --cov-report=term --cov-report=xml --junitxml=report.xml tests/
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: report.xml

# Build the documentation and publish it to GitLab Pages.
#
# The tutorials under docs/tutorials/ are committed WITHOUT outputs and executed
# by myst-nb during the build, so this job needs everything they import -- which
# is why it installs the package itself plus a segmentation backend, unlike the
# job that used to live here (it installed neither `acia`, which docs/conf.py
# imports for __version__, nor myst-parser, so it cannot have worked).
#
# Only ONE segmentation backend can be installed: cellpose<4, cellpose>=4 and
# omnipose pin conflicting versions. The getting-started path uses Cellpose-SAM.
#
# On the biggpu runner the notebooks detect CUDA and process every 4th frame; on
# a CPU runner they fall back to every 20th automatically, so this job is correct
# either way -- it just produces a finer-grained tutorial when a GPU is present.
#
# Note this publishes a SECOND copy of the site; GitHub Pages
# (https://smlci.github.io/acia-core) remains the URL declared in
# pyproject.toml's [project.urls]. Keep them from drifting.
pages:
  stage: deploy
  image: python:3.12
  tags:
    - biggpu
  variables:
    # GitLab can only cache paths inside CI_PROJECT_DIR, so move Cellpose's
    # model store (~300 MB, default ~/.cellpose/models) into the project.
    CELLPOSE_LOCAL_MODELS_PATH: "$CI_PROJECT_DIR/.cellpose-models"
  cache:
    - key: pip-${CI_JOB_IMAGE}
      paths:
        - .cache/pip/
    # ~42 MB Cell Tracking Challenge sample the notebooks download themselves
    - key: docs-tutorial-data-v1
      paths:
        - docs/tutorials/data/
    - key: docs-cellpose-weights-v1
      paths:
        - .cellpose-models/
    # myst-nb re-executes only notebooks whose source changed
    - key: docs-jupyter-cache-v1
      paths:
        - docs/_build/.jupyter_cache/
  script:
    - pip install -e ".[docs,cellpose-sam]"
    # -W: the build must stay warning-free, exactly as it does on GitHub
    - sphinx-build -b html -W --keep-going docs public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
