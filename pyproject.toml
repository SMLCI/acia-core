[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acia"
version = "0.4.0"
description = "The acia library provides utility functionality for analyzing 2D+t time-lapse image sequences in microfluidic live-cell imaging experiments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Johannes Seiffarth", email = "j.seiffarth@fz-juelich.de" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
keywords = ["acia", "image-analysis", "cell-tracking", "segmentation", "microscopy"]
dependencies = [
    "shapely>=2.0.0",
    "tqdm>=4.61.2",
    "opencv-python-headless>=4.5.5",
    "rtree>=0.9.7",
    "pillow>=8.3.1",
    "scikit-learn>=1.0",
    "scipy>=1.9",
    "scikit-image>=0.19.1",
    "seaborn>=0.11.2",
    "roifile>=2021.6.6",
    "tifffile>=2020.11.18",
    "pycocotools>=2.0.7",
    "pint>=0.18",
    "pint-pandas>=0.5",
    # 2.6 for the `progress_bar` dict form + the engine API scale()'s progress
    # reporting builds on (see acia/analysis/_scale_progress.py)
    "papermill>=2.6.0",
    "numpy>=1.23.1",
    "rasterio>=1.3.6",
    "retry>=0.9.2",
    "imagecodecs",
    "influxdb_client",
    "ipywidgets>=8.0.0",
    "plotly",
    "fsspec>=2023.1.0",
    "platformdirs>=3.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "imageio>=2.0",
    "moviepy<2",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.0",
    "mypy>=1.19.0",
    "pre-commit>=3.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-sugar>=1.0.0",
    # provides the "python3" kernelspec that the papermill-based scale() tests
    # need; without it tests/analysis/test_scale.py fails with NoSuchKernel
    "ipykernel>=6.0",
    "coverage>=7.0.0",
    "tox>=4.0.0",
    "build",
    "twine>=5.0.0",
    "bump-my-version>=0.20.0",
]
docs = [
    "sphinx>=7.0.0",
    "pydata-sphinx-theme>=0.15",
    # myst-nb is a superset of myst-parser: MyST markdown *plus* executable
    # notebooks. The tutorials under docs/tutorials/ are committed without
    # outputs (nbstripout) and executed at build time, so the published pages
    # are proof the tutorials still run.
    "myst-nb>=1.1",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "ipykernel>=6.0",
]
# scale() renders each executed stage notebook to HTML beside it, so a run is
# readable without Jupyter. Optional: the export is best-effort and a missing
# nbconvert costs nothing but that file.
report = ["nbconvert>=7.0"]
omero = ["omero-py>=5.9.3"]
# export recorded stage runs as OpenLineage events (acia.analysis.lineage). The
# manifest stays the source of truth; this is only for handing lineage to tooling
# outside the project, so it stays optional.
lineage = ["openlineage-python>=1.0"]
notebook = ["ipywidgets>=8.0.0"]
remote = ["smbprotocol>=1.10.0", "keyring>=24.0.0"]
nd2 = ["nd2>=0.10"]
czi = ["aicspylibczi>=3.1"]
widget = ["anywidget>=0.9"]

# --- segmentation backends -------------------------------------------------
# One extra per backend so a backend installs with a single declarative command
# (e.g. `pip install acia[omnipose]`). Pins mirror the acia-workflows
# segmentation notebooks (notebooks/segmentation/*.ipynb). The backends have
# CONFLICTING torch / numpy / cellpose requirements (classic Cellpose is
# `cellpose<4`, Cellpose-SAM is `cellpose>=4`, Omnipose pins `scipy==1.15.3`),
# so they are MUTUALLY EXCLUSIVE -- install exactly one per environment.
cellpose = ["cellpose<4"]  # classic Cellpose (cyto / nuclei models)
# Cellpose-SAM; the notebook used git@8ef88040 before the 4.0 release, which is
# now the released `cellpose>=4` line.
cellpose-sam = ["cellpose>=4"]
omnipose = [
    "omnipose==1.0.6",  # provides the `cellpose_omni` backend
    "torch",
    "torchvision",
    "torchaudio",
    "natsort",
    "scipy==1.15.3",
]
# flowpose-rt: lightweight omnipose-compatible backend (no cellpose/omnipose/numba
# at runtime). Not on PyPI yet -- install the flowpose-rt package from source
# (e.g. `pip install ../flowpose-rt`) until it's published.
flowpose-rt = ["flowpose-rt", "torch"]
# stardist: TensorFlow/Keras-based, no torch. Has no HARD pin conflict with the
# torch-based backends above, but still install it into its own environment --
# running TensorFlow and torch's respective CUDA/cuDNN stacks side by side in
# one env is a common source of GPU init failures even without a pip conflict.
# No bacteria-specific pretrained model exists; its star-convex shape prior
# fits round cells/nuclei much better than elongated rod-shaped bacteria.
stardist = ["stardist", "tensorflow"]
# micro-sam (μSAM): SAM-based light-microscopy foundation model. pip works but
# the project recommends conda/mamba (native vigra/nifty deps); see
# acia-workflows-lab/notebooks/segmentation_comparison/README.md for the
# conda-forge install this extra doesn't cover.
microsam = ["micro_sam"]
# DeLTA 3.x (package `delta-microscopy`, import name `delta`): targets the
# torch backend deliberately, so it shares a torch stack with the backends
# above instead of pulling in TensorFlow (v3 rewrote DeLTA on Keras 3 as a
# multi-backend model -- tf/torch/jax are now interchangeable extras upstream).
delta = ["delta-microscopy[torch-cpu]"]

[project.scripts]
acia = "acia.cli:main"

[project.urls]
Homepage = "https://github.com/SMLCI/acia-core"
Repository = "https://github.com/SMLCI/acia-core"
Documentation = "https://smlci.github.io/acia-core"

[tool.setuptools.packages.find]
include = ["acia", "acia.*"]

# Ruff configuration (replaces black, isort, flake8, pylint)
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["acia", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line length (handled by formatter)
    "B008",   # function call in default argument (common pattern)
    "SIM108", # ternary operator (sometimes less readable)
]

[tool.ruff.lint.isort]
known-first-party = ["acia"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Mypy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["docs", "build", "dist"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
# integration tests (external data / heavy deps) are deselected by default so
# normal and CI runs stay fast; run them explicitly with `-m integration`
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "integration: needs external data or heavy deps (trackastra, laptrack, ffmpeg)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["acia"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# Bump-my-version configuration (replaces bump2version)
[tool.bumpversion]
current_version = "0.4.0"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "acia/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

# promote the changelog: turn the Unreleased section into a dated version section
# and re-seed an empty Unreleased on every bump
[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = "## [Unreleased]\n\n## [{new_version}] - {now:%Y-%m-%d}"
