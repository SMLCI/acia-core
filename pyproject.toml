[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acia"
version = "0.3.2"
description = "The acia library provides utility functionality for analyzing 2D+t time-lapse image sequences in microfluidic live-cell imaging experiments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Johannes Seiffarth", email = "j.seiffarth@fz-juelich.de" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
keywords = ["acia", "image-analysis", "cell-tracking", "segmentation", "microscopy"]
dependencies = [
    "shapely>=2.0.0",
    "tqdm>=4.61.2",
    "opencv-python-headless>=4.5.5",
    "rtree>=0.9.7",
    "pillow>=8.3.1",
    "scikit-learn>=1.0",
    "scikit-image>=0.19.1",
    "seaborn>=0.11.2",
    "roifile>=2021.6.6",
    "tifffile>=2020.11.18",
    "pycocotools>=2.0.7",
    "pint>=0.18",
    "papermill>=2.4.0",
    "numpy>=1.23.1",
    "rasterio>=1.3.6",
    "retry>=0.9.2",
    "imagecodecs",
    "influxdb_client",
    "ipywidgets>=8.0.0",
    "plotly",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-sugar>=1.0.0",
    "coverage>=7.0.0",
    "tox>=4.0.0",
    "build",
    "twine>=5.0.0",
    "bump-my-version>=0.20.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
]
omero = ["omero-py>=5.9.3"]

[project.scripts]
acia = "acia.cli:main"

[project.urls]
Homepage = "https://github.com/JuBiotech/acia-core"
Repository = "https://github.com/JuBiotech/acia-core"
Documentation = "https://jubiotech.github.io/acia-core"

[tool.setuptools.packages.find]
include = ["acia", "acia.*"]

# Ruff configuration (replaces black, isort, flake8, pylint)
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["acia", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line length (handled by formatter)
    "B008",   # function call in default argument (common pattern)
    "SIM108", # ternary operator (sometimes less readable)
]

[tool.ruff.lint.isort]
known-first-party = ["acia"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Mypy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["docs", "build", "dist"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["acia"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# Bump-my-version configuration (replaces bump2version)
[tool.bumpversion]
current_version = "0.3.2"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "acia/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
