name: Docs

on:
  push:
    branches: [master, main]
  pull_request:
    paths:
      - "docs/**"
      - "acia/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# allow only one concurrent Pages deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The tutorials under docs/tutorials/ are committed WITHOUT outputs and
      # executed here by myst-nb, so this job needs everything they import.
      # Only ONE segmentation backend can be installed (cellpose<4, cellpose>=4
      # and omnipose pin conflicting versions) -- the getting-started path uses
      # Cellpose-SAM.
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - run: pip install -e ".[docs,cellpose-sam]"

      # ~42 MB Cell Tracking Challenge sample, downloaded by the notebooks.
      - name: Cache tutorial sample data
        uses: actions/cache@v4
        with:
          path: docs/tutorials/data
          key: tutorial-data-DIC-C2DH-HeLa-v1

      # Cellpose-SAM weights (~300 MB) are fetched on first model load.
      - name: Cache segmentation model weights
        uses: actions/cache@v4
        with:
          path: ~/.cellpose
          key: cellpose-sam-weights-v1

      # myst-nb only re-executes notebooks whose source changed; the cache makes
      # a docs-only edit cheap.
      - name: Cache notebook execution
        uses: actions/cache@v4
        with:
          path: docs/_build/.jupyter_cache
          key: jupyter-cache-${{ hashFiles('docs/tutorials/*.ipynb', 'pyproject.toml') }}
          restore-keys: jupyter-cache-

      - name: Build docs
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      # Only the default branch publishes; pull requests build to verify.
      - id: deploy
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4
