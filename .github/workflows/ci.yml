name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # cheapest checks first so formatting/lint breaks fail fast
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # pinned for deterministic lint/format (must match pre-commit + dev extra)
      - run: pip install ruff==0.15.15
      - run: ruff check acia tests
      - run: ruff format --check acia tests

  # mypy is clean; pinned for deterministic results (must match pre-commit)
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install mypy==1.19.1
      - run: mypy acia --ignore-missing-imports

  # fast unit tests only — integration tests (data / trackastra / ffmpeg) are
  # deselected by the default `-m 'not integration'` addopts in pyproject.toml
  test:
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e .
      - run: pip install pytest pytest-cov pytest-sugar
      - run: pytest --cov=acia --cov-report=xml
      # Optional: enable once a Codecov token/badge is set up
      # - uses: codecov/codecov-action@v4
      #   with:
      #     files: coverage.xml
